# Mosquitto MQTT Broker Configuration for CrisisMesh

# Default listener
listener 1883
protocol mqtt

# WebSocket listener
listener 9001
protocol websockets

# Authentication
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Log level (debug, info, notice, warning)
log_type all
log_timestamp true

# Maximum connections
max_connections -1

# Message settings
max_queued_messages 1000
max_inflight_messages 20
