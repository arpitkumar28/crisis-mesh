name: crisis_mesh
description: "CrisisMesh - AI-powered disaster intelligence and emergency response platform"
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.2

  # State Management
  flutter_riverpod: ^2.4.0

  # Navigation
  go_router: ^13.0.0

  # Networking
  dio: ^5.4.0
  url_launcher: ^6.3.0
  share_plus: ^13.3.0

  # Location & Permissions
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  
  # Auth
  local_auth: ^2.2.0

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # WebSocket
  socket_io_client: ^2.0.3+1

  # Secure Storage
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/crisismesh-icon.png
