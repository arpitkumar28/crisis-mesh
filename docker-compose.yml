services:
  # PostgreSQL Database with PostGIS
  postgres:
    image: postgis/postgis:14-3.3-alpine
    container_name: crisis-mesh-postgres
    environment:
      POSTGRES_USER: crisis_mesh
      POSTGRES_PASSWORD: crisis_mesh_password
      POSTGRES_DB: crisis_mesh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crisis-mesh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crisis_mesh"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MQTT Broker
  mqtt:
    image: eclipse-mosquitto:2
    container_name: crisis-mesh-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - crisis-mesh-network
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS API
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: crisis-mesh-api
    environment:
      NODE_ENV: development
      API_PORT: 3002
      DATABASE_URL: postgresql://crisis_mesh:crisis_mesh_password@postgres:5432/crisis_mesh
      MQTT_BROKER_URL: mqtt://mqtt:1883
      JWT_SECRET: ${JWT_SECRET}
      NEWS_API_KEY: ${NEWS_API_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - mqtt
    volumes:
      - ./services/api/src:/app/src
    networks:
      - crisis-mesh-network

  # Python Simulator
  simulator:
    build:
      context: ./apps/simulator
      dockerfile: Dockerfile
    container_name: crisis-mesh-simulator
    environment:
      MQTT_BROKER: mqtt://mqtt:1883
      API_URL: http://api:3002/api
      SIMULATION_SCENARIO: ${SIMULATION_SCENARIO:-normal}
      NUM_DEVICES: ${NUM_DEVICES:-5}
    depends_on:
      - mqtt
      - api
    volumes:
      - ./apps/simulator:/app
    networks:
      - crisis-mesh-network

  # Python AI Service
  ai-service:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: crisis-mesh-ai
    environment:
      API_URL: http://api:3002/api
      MQTT_BROKER: mqtt://mqtt:1883
      AI_SERVICE_PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./services/ai:/app
    depends_on:
      - mqtt
      - api
    networks:
      - crisis-mesh-network

networks:
  crisis-mesh-network:
    driver: bridge

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_logs:
